<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Ingresar · NutriMeta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container" style="max-width: 420px; margin-top: 10vh;">
    <h3 class="mb-4 text-center">Panel administrativo NutriMeta</h3>
    <div class="alert alert-danger" th:if="${param.error}">Correo o contraseña incorrectos.</div>
    <div class="alert alert-success" th:if="${param.salio}">Sesión cerrada.</div>
    <form th:action="@{/portal/login}" method="post">
        <div class="mb-3">
            <label class="form-label">Correo</label>
            <input type="email" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">Ingresar</button>
    </form>
</div>
</body>
</html>
