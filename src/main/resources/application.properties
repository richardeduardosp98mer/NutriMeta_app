spring.application.name=nutrimeta-backend

spring.datasource.url=jdbc:mysql://localhost:3306/nutrimeta
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

# Proyecto de Firebase cuyos ID tokens acepta la API (no es un secreto).
firebase.project-id=${FIREBASE_PROJECT_ID:nutrimeta-7d684}
