<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <title th:text="${titulo} + ' · NutriMeta'">NutriMeta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:fragment="nav" class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/controller}">NutriMeta — Panel</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/controller/alimentos}">Alimentos</a>
            <a class="nav-link" th:href="@{/controller/usuarios}">Usuarios</a>
            <a class="nav-link" th:href="@{/controller/registros}">Registros</a>
            <a class="nav-link" th:href="@{/controller/grupos}">Grupos</a>
            <a class="nav-link" th:href="@{/controller/niveles-actividad}">Niveles de actividad</a>
            <a class="nav-link" th:href="@{/controller/tipos-comida}">Tipos de comida</a>
            <a class="nav-link" th:href="@{/controller/administradores}">Administradores</a>
        </div>
        <form th:action="@{/controller/logout}" method="post" class="d-flex">
            <button class="btn btn-outline-light btn-sm" type="submit">Cerrar sesión</button>
        </form>
    </div>
</nav>
</body>
</html>
