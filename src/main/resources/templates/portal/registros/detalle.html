<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registro de comida')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div class="container">
  <h2>Registro del <span th:text="${registro.fecha}"></span></h2>
  <p><strong>Usuario:</strong> <span th:text="${registro.usuario.nombre}"></span></p>

  <form th:action="@{/portal/registros/{id}/guardar(id=${registro.idRegistro})}" method="post">
    <div class="row">
      <div class="col mb-3">
        <label class="form-label">Fecha</label>
        <input class="form-control" type="date" name="fecha" th:value="${registro.fecha}" required>
      </div>
      <div class="col mb-3">
        <label class="form-label">Tipo de comida</label>
        <select class="form-select" name="idTipoComida">
          <option th:each="t : ${tiposComida}" th:value="${t.idTipoComida}" th:text="${t.nombre}"
                  th:selected="${t.idTipoComida == registro.tipoComida.idTipoComida}"></option>
        </select>
      </div>
    </div>

    <table class="table">
      <thead><tr><th>Alimento</th><th>Cantidad (g)</th><th>kcal</th></tr></thead>
      <tbody>
      <tr th:each="d : ${registro.detalles}">
        <td th:text="${d.alimento.nombre}"></td>
        <td>
          <input type="hidden" name="idDetalle" th:value="${d.idDetalle}">
          <input class="form-control" type="number" step="0.1" name="cantidadG" th:value="${d.cantidadG}">
        </td>
        <td th:text="${d.energiaKcal}"></td>
      </tr>
      </tbody>
    </table>
    <button class="btn btn-primary" type="submit">Guardar cambios</button>
  </form>

  <form th:action="@{/portal/registros/{id}/eliminar(id=${registro.idRegistro})}" method="post" class="mt-3"
        onsubmit="return confirm('¿Eliminar este registro?');">
    <button class="btn btn-danger" type="submit">Eliminar registro</button>
  </form>
</div>
</body>
</html>
